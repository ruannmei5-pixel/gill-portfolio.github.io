<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220">
  <!-- Placeholder certificate graphic. Replace this file (or the
       `certificate.image` path in src/data/achievements.ts) with a
       real certificate scan/photo once available. -->
  <rect width="320" height="220" rx="10" fill="#14171C" />
  <rect x="6" y="6" width="308" height="208" rx="6" fill="none" stroke="#262B33" stroke-width="1.5" stroke-dasharray="5 4" />

  <!-- faint contour lines, echoing the site's elevation motif -->
  <g stroke="#1A1E24" stroke-width="1">
    <line x1="0" y1="70" x2="320" y2="70" />
    <line x1="0" y1="150" x2="320" y2="150" />
  </g>

  <!-- small seal mark -->
  <circle cx="160" cy="92" r="22" fill="none" stroke="#8B6FF2" stroke-width="1.5" />
  <circle cx="160" cy="92" r="6" fill="#8B6FF2" opacity="0.5" />

  <text
    x="160"
    y="140"
    text-anchor="middle"
    font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace"
    font-size="12"
    letter-spacing="2"
    fill="#9AA2AD"
  >CERTIFICATE</text>
  <text
    x="160"
    y="160"
    text-anchor="middle"
    font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace"
    font-size="9"
    letter-spacing="1"
    fill="#78808C"
  >placeholder — awaiting scan</text>
</svg>
